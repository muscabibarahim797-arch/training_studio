<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>training studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
     <!-- header -->
    <header class="header">
        <div class="container">
            <nav class="main-nav">
                <a href="index.html" class="logo">Training <em>Studio</em></a>

                <ul class="nav">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Classes</a></li>
                    <li><a href="#">Schedules</a></li>
                    <li><a href="#">Contact</a></li>
                    <li><a href="#" class="main-button">Sign Up</a></li>
                </ul>

                <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>

                <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
                    <ul class="mobile-nav">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Classes</a></li>
                        <li><a href="#">Schedules</a></li>
                        <li><a href="#">Contact</a></li>
                        <li class="mobile-sign"><a href="#" class="main-button">Sign Up</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>
    <!-- HERO SECTION -->
    <section class="hero">
        <video autoplay muted loop playsinline class="hero-video">
            <source src="3195943-uhd_3840_2160_25fps.mp4" type="video/mp4" />
            Your browser does not support the video tag.
        </video>

        <div class="hero-overlay"></div>

        <div class="hero-content">
            <p>WORK HARDER, GET STRONGER</p>
            <h1>EASY WITH OUR <span>GYM</span></h1>
            <a href="#" class="hero-btn">BECOME A MEMBER</a>
        </div>
    </section>

















     <script>
        const btn = document.querySelector(".menu-toggle");
        const menu = document.querySelector("#mobileMenu");

        function closeMenu() {
            btn.classList.remove("is-open");
            menu.classList.remove("open");
            btn.setAttribute("aria-expanded", "false");
            menu.setAttribute("aria-hidden", "true");
        }

        btn.addEventListener("click", () => {
            const isOpen = btn.classList.toggle("is-open");
            menu.classList.toggle("open", isOpen);
            btn.setAttribute("aria-expanded", String(isOpen));
            menu.setAttribute("aria-hidden", String(!isOpen));
        });

        // close when click outside
        document.addEventListener("click", (e) => {
            if (!menu.contains(e.target) && !btn.contains(e.target)) closeMenu();
        });

        // close when clicking a link
        menu.querySelectorAll("a").forEach(a => {
            a.addEventListener("click", closeMenu);
        });

        // close on ESC
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeMenu();
        });
    </script>
</body>
</html>
